name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      # Canonical URLs point at the address Lighthouse serves the build from.
      - name: Build
        run: npm run build
        env:
          SITE_URL: http://127.0.0.1:4323

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke and accessibility tests
        run: npm test

      - name: Lighthouse budgets
        run: npx @lhci/cli@0.15.1 autorun

      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
